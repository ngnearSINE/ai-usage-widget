# 태그(v1.2.3)를 올리면 Windows(x64·arm64 설치 파일 하나 + zip)와 Ubuntu(x64·arm64 AppImage·deb)를 만들어 GitHub Releases에 게시한다.
# 앱의 자동 업데이트는 이 Releases의 latest.yml을 본다.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 태그와 package.json 버전 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "package.json 버전($v)과 태그(${{ github.ref_name }})가 다릅니다." }

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: 설치 파일(x64·arm64 하나)·zip 만들고 Releases에 게시
        run: npx electron-builder --win --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Releases 설명을 CHANGELOG.md(+CHANGELOG.en.md)의 이번 버전 절과 설치 방법으로 채우기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          # CHANGELOG 파일에서 '## <버전>' 절의 본문(다음 '## ' 제목 전까지)을 꺼낸다. 절이 없으면 $null.
          function Get-VersionSection([string]$file) {
            if (-not (Test-Path $file)) { return $null }
            $lines = @(Get-Content $file -Encoding utf8)
            $start = [Array]::IndexOf($lines, "## $v")
            if ($start -lt 0) { return $null }
            $body = @()
            for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## '); $i++) { $body += $lines[$i] }
            return ($body -join "`n").Trim()
          }
          $notes = Get-VersionSection 'CHANGELOG.md'
          if ($null -eq $notes) { Write-Warning "CHANGELOG.md에 '## $v' 절이 없습니다."; exit 0 }
          # 영어 변경 내역에 같은 버전 절이 있으면 한국어 절 뒤에 '## English'로 붙인다.
          $en = Get-VersionSection 'CHANGELOG.en.md'
          if ($en) { $notes = $notes + "`n`n## English`n`n" + $en }
          # 설치 방법(docs/release-install.md)을 뒤에 붙이고, 파일 이름의 {version}을 이번 버전으로 바꾼다.
          $install = if (Test-Path docs/release-install.md) { (Get-Content docs/release-install.md -Raw -Encoding utf8).Replace('{version}', $v).Trim() } else { '' }
          (($notes + "`n`n" + $install).Trim()) | Set-Content notes.md -Encoding utf8
          gh release edit '${{ github.ref_name }}' --notes-file notes.md

  # Windows 작업이 Releases를 만든 뒤에 올린다(동시에 올리면 릴리스가 둘 생길 수 있다).
  # arm64 패키지도 x64 러너에서 함께 만든다(네이티브 모듈이 없어 교차 빌드 가능).
  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: AppImage·deb(x64·arm64) 만들고 Releases에 게시
        run: npx electron-builder --linux --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
